name            = "ember-ai-proxy"
main            = "worker.js"
compatibility_date = "2024-09-01"

# ── Secrets (set once, stored encrypted, never in this file or Git) ──
#   wrangler secret put GEMINI_API_KEY        (https://aistudio.google.com/apikey)
#   wrangler secret put GROQ_API_KEY          (optional)
#   wrangler secret put GITHUB_MODELS_TOKEN   (optional)
#   wrangler secret put OPENROUTER_API_KEY    (optional)
#   wrangler secret put EMBER_PASSPHRASE      (optional — enables the passphrase gate)

# ── Image generation (Cloudflare Workers AI — free, no key) ──
[ai]
binding = "AI"

# ── Rate limiting (per-IP/day) via Cloudflare KV ──
[[kv_namespaces]]
binding = "RL"
id      = "d41cb2a5c4774aa296d1dcd30dffdabb"
